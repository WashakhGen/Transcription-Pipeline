[project]
name = "audio-transcription"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "faster-whisper>=1.2.1",
    "pydantic-settings>=2.15.0",
]


[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.pyright]
include = ["core", "manager", "schemas", "api", "storage", "main.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
